<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Dashboard</title>
<link rel="icon" href="/web/icon-192.png">
<link rel="stylesheet" href="/web/tv.css">
</head>
<body>
<!-- The TV page: a fixed 1920 x 1080 screen, scaled to fit any TV, run with a remote.
     For Android TV, Fire TV, LG webOS, Samsung Tizen, or any browser at /tv.
     It looks and works like the Roku app. -->
<div id="stage">
  <div id="clockbox"><b id="clock"></b><span id="date"></span></div>
  <div id="tabs"></div>
  <div id="wx" hidden></div>
  <div id="chips" hidden></div>
  <main id="screen"></main>
  <footer id="foot"><div id="hint"></div><div id="status"></div></footer>
  <div id="layer" hidden></div>
  <div id="alert" hidden></div>
  <audio id="music" preload="none"></audio>
</div>
<script src="/web/demo.js"></script>
<script src="/web/tv.js"></script>
</body>
</html>
